# Lets you mention @claude in an issue, PR comment or PR review comment.
# Claude reads CLAUDE.md, works on the request, and replies or pushes a branch.
# Setup: install the Claude GitHub App (https://github.com/apps/claude) on this repo,
# then add ONE repo secret:
#   CLAUDE_CODE_OAUTH_TOKEN  (uses your Claude subscription; generate with `claude setup-token`)
#   or ANTHROPIC_API_KEY     (pay-per-use API key; swap the input line below)
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15"
